<div class="space-y-6 container-fluid">
  <!-- Cabeçalho -->
  <div class="flex justify-between items-center">
    <div class="text-left">
      <h1 class="text-2xl font-bold">Gerenciamento de Usuários</h1>
      <p class="text-sm">Gerencie os usuários do sistema</p>
    </div>
    <div class="flex gap-2">
      <button id="usuarios-btn-novo" class="btn btn-success">
        <i class="fa-solid fa-plus"></i>
        Novo Usuário
      </button>
    </div>
  </div>

  <!-- Filtros -->  
  <div class="card bg-base-100 shadow-md">
    <div class="card-body">
      <h2 class="card-title mb-4">Filtros</h2>
      <form id="usuarios-form-filtros" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
        <!-- Filtro por empresa -->
        <div class="form-control">
          <label class="label">
            <span class="label-text">Empresa</span>
          </label>
          <select id="filtro-empresa" name="empresa_id" class="select select-bordered">
            <option value="">Todas as empresas</option>
          </select>
        </div>

        <!-- Busca por texto -->
        <div class="form-control">
          <label class="label">
            <span class="label-text">Buscar usuário</span>
          </label>
          <input type="text" id="filtro-q" name="q" placeholder="Nome do usuário..." class="input input-bordered">
        </div>

        <!-- Filtro por permissão -->
        <div class="form-control">
          <label class="label">
            <span class="label-text">Permissão</span>
          </label>
          <select id="filtro-permissao" name="permissao_id" class="select select-bordered">
            <option value="">Todas as permissões</option>
          </select>
        </div>

        <!-- Filtro por canal -->
        <div class="form-control">
          <label class="label">
            <span class="label-text">Canal</span>
          </label>
          <select id="filtro-canal" name="canal_id" class="select select-bordered">
            <option value="">Todos os canais</option>
          </select>
        </div>

        <!-- Filtro por status -->
        <div class="form-control">
          <label class="label">
            <span class="label-text">Status</span>
          </label>
          <select id="filtro-status" name="status" class="select select-bordered">
            <option value="ativo" selected>Ativo</option>
            <option value="deletado">Deletado</option>
            <option value="">Todos</option>
          </select>
        </div>

        <!-- Botões -->
        <div class="md:col-span-2 lg:col-span-5 flex gap-2 justify-end">
          <button type="button" id="usuarios-btn-limpar" class="btn btn-outline">
            <i class="fa-solid fa-eraser"></i>
            Limpar
          </button>
          <button type="submit" id="usuarios-btn-filtrar" class="btn btn-primary">
            <i class="fa-solid fa-search"></i>
            Filtrar
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Tabela de Usuários -->
  <div class="card bg-base-100 shadow-md">
    <div class="card-body">
      <!-- Loading -->
      <div id="usuarios-loading" class="hidden flex justify-center items-center py-8">
        <span class="loading loading-spinner loading-lg"></span>
        <span class="ml-2">Carregando usuários...</span>
      </div>

      <!-- Tabela -->
      <div id="usuarios-data-container" class="overflow-x-auto">
        <table class="table table-zebra">
          <thead>
            <tr>
              <th class="cursor-pointer" data-sort="nome">
                Nome
                <i class="fas fa-sort ml-1"></i>
              </th>
              <th class="cursor-pointer" data-sort="usuario">
                Usuário
                <i class="fas fa-sort ml-1"></i>
              </th>
              <th>E-mail</th>
              <th class="cursor-pointer" data-sort="permissao_nome">
                Permissão
                <i class="fas fa-sort ml-1"></i>
              </th>
              <th>Canais de Atendimento</th>
              <th class="cursor-pointer" data-sort="created_at">
                Criado em
                <i class="fas fa-sort ml-1"></i>
              </th>
              <th class="cursor-pointer" data-sort="updated_at">
                Atualizado em
                <i class="fas fa-sort ml-1"></i>
              </th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="usuarios-table-body">
            <tr>
              <td colspan="8" class="text-center py-12">
                <div class="mx-auto w-24 h-24 bg-blue-100 dark:bg-blue-900 rounded-full flex items-center justify-center mb-4">
                  <i class="fa-solid fa-users text-3xl text-blue-600 dark:text-blue-400"></i>
                </div>
                <p class="text-gray-500">Nenhum usuário encontrado</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Paginação -->
  <div id="usuarios-paginacao" class="mt-6">
    <!-- Paginação será inserida aqui -->
  </div>
</div>

<!-- Container para modais -->
<div id="usuarios-modal-container"></div>

<script src="/sessao/gestao/administrativo/usuarios/js.js?v=4">
</script>
