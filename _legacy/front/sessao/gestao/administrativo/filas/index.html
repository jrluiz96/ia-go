<div class="container mx-auto p-4 space-y-6">
    <div class="flex justify-between items-center">
        <div>
            <h1 class="text-3xl font-bold text-base-content">Gerenciamento de Filas de Atendimento</h1>
            <p class="text-base-content/70 mt-1">Gerencie filas de atendimento e os operadores associadas</p>
        </div>
    </div>
    <!-- Tabs -->
    <div class="tabs tabs-boxed bg-base-300">
        <a id="tab-fila-callphone" class="tab tab-active" onclick="switchTab('fila-callphone')">
            <i class="fas fa-user-shield mr-2"></i>Callphone
        </a>
        <a id="tab-fila-webbot" class="tab" onclick="switchTab('fila-webbot')">
            <i class="fas fa-desktop mr-2"></i>Webbot
        </a>
    </div>

    <!-- Aba Fila Callphone -->
    <div id="aba-fila-callphone" class="space-y-4">
        <!-- Filtros Fila Callphone -->
        <div class="card bg-base-100 shadow-sm">
            <div class="card-body p-4">
                <form id="filtros-fila-callphone" class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
                    <!-- Busca -->
                    <div class="form-control"><!-- quero o tamanho de 3 -->
                        <label class="label">
                            <span class="label-text">Buscar</span>
                        </label>
                        <input type="text" id="filtro-fila-callphone" name="q" class="input input-bordered"
                            placeholder="Nome da fila...">
                    </div>

                </form>
            </div>
        </div>

        <!-- Tabela Filas Callphone -->
        <div class="card bg-base-100 shadow-sm">
            <div class="card-body p-0">
                <!-- Loading -->
                <div id="permissoes-loading" class="hidden p-8">
                    <progress class="progress progress-primary w-full"></progress>
                    <p class="text-center mt-2">Carregando filas...</p>
                </div>

                <!-- Tabela -->
                <div id="permissoes-data-container">
                    <table class="table table-zebra">
                        <thead>
                            <tr>
                                <th class="cursor-pointer" data-sort="name">
                                    Nome
                                    <i class="fas fa-sort ml-1"></i>
                                </th>
                                <th class="cursor-pointer" data-sort="sla">
                                    SLA
                                    <i class="fas fa-sort ml-1"></i>
                                </th>
                                <th>Quantidade de Operadores</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="permissoes-tbody">
                            <!-- Dados serão inseridos aqui -->
                        </tbody>
                    </table>
                </div>

                <!-- Paginação -->
                <div id="permissoes-pagination-container" class="p-4 border-t">
                    <!-- Paginação será inserida aqui -->
                </div>
            </div>
        </div>
    </div>

    <!-- Aba Fila Webbot -->
    <div id="aba-fila-webbot" class="space-y-4 hidden">
        <!-- Filtros Fila webbot -->
        <div class="card bg-base-100 shadow-sm">
            <div class="card-body p-4">
                <form id="filtros-fila-webbot" class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                    <!-- Empresa -->
                    <div class="form-control">
                        <label class="label">
                            <span class="label-text">Empresa</span>
                        </label>
                        <select id="filtro-empresa-webbot" name="empresa_id" class="select select-bordered">
                            <option value="">Todas as empresas</option>
                        </select>
                    </div>
                    <!-- Busca -->
                    <div class="form-control">
                        <label class="label">
                            <span class="label-text">Buscar</span>
                        </label>
                        <input type="text" id="filtro-fila-webbot" name="q" class="input input-bordered"
                            placeholder="Nome da fila...">
                    </div>
                    <div class="form-control"></div>
                    <div class="form-control">
                        <button type="button" id="btn-nova-fila-webbot" class="btn btn-success">
                            <i class="fas fa-plus mr-2"></i>
                            Nova Fila
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Tabela Filas Webbot -->
        <div class="card bg-base-100 shadow-sm">
            <div class="card-body p-0">
                <!-- Loading -->
                <div id="webbot-loading" class="hidden p-8">
                    <progress class="progress progress-primary w-full"></progress>
                    <p class="text-center mt-2">Carregando Filas...</p>
                </div>
                <!-- Tabela -->
                <div id="webbot-data-container">
                    <table class="table table-zebra">
                        <thead>
                            <tr>
                                <th class="cursor-pointer" data-sort="nome">
                                    Nome
                                    <i class="fas fa-sort ml-1"></i>
                                </th>
                                <th class="cursor-pointer" data-sort="created_at">
                                    SLA
                                    <i class="fas fa-sort ml-1"></i>
                                </th>
                                <th class="cursor-pointer" data-sort="created_at">
                                    Operadores
                                    <i class="fas fa-sort ml-1"></i>
                                </th>
                                <th>Empresa</th>
                                <th class="cursor-pointer" data-sort="updated_at">
                                    Atualizado em
                                    <i class="fas fa-sort ml-1"></i>
                                </th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="webbot-tbody">
                            <!-- Dados serão inseridos aqui -->
                        </tbody>
                    </table>
                </div>

                <!-- Paginação -->
                <div id="webbot-pagination-container" class="p-4 border-t">
                    <!-- Paginação será inserida aqui -->
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Containers -->
    <div id="fila-callphone"></div>
    <div id="fila-webbot"></div>
</div>

<!-- Scripts necessários -->
<script src="/js/modal.js?v=4"></script>
<script src="/js/paginacao.js?v=4"></script>
<script src="/sessao/gestao/administrativo/filas/js.js?v=4"></script>
