<!DOCTYPE html>
<html lang="pt-br" data-theme="dim">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IA-GO</title>
  <link rel="icon" href="/img/logo/Icon.svg" type="image/x-icon">

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.7.2/dist/full.min.css" rel="stylesheet" type="text/css" />

  <script src="./js/jquery.js?v=4"></script>
  <!-- Ícones (Font Awesome) -->
  <link rel="stylesheet" href="/fonts/font-awesome/7.1.0/css/all.min.css">

  <script src="./js/request.js?v=4"></script>
  <script src="./js/glob.js?v=4"></script>
  <script src="./js/login.js?v=4"></script>
</head>

<body class="min-h-screen flex items-center justify-center bg-base-200">
  <div class="card w-full max-w-md shadow-2xl bg-base-100 transition-all duration-300 ease-in-out" id="loginForm">
    <div class="card-body">
      <h2 class="text-2xl font-bold text-primary text-center">Bem Vindo.</h2>
      <h5 class="text-1x1 text-gray-400 text-center">Para prosseguirmos acesso com suas credenciais.</h5>
      <!-- Formulário -->
      <form action="javascript:createSession()" class="mt-6">
        <!-- Usuário -->
        <div class="form-control">
          <label class="label">
            <span class="label-text">Usuário</span>
          </label>
          <label class="input input-bordered flex items-center gap-2">
            <i class="fas fa-user text-gray-500"></i>
            <input type="text" id="usuario" placeholder="Digite seu usuário" class=" grow" required />
          </label>
        </div>

        <!-- Senha -->
        <div class="form-control mt-4">
          <label class="label">
            <span class="label-text">Senha</span>
          </label>
          <label class="input input-bordered flex items-center gap-2">
            <i class="fas fa-key text-gray-500"></i>
            <input type="password" id="senha" placeholder="Digite sua senha" class=" grow" required />
          </label>
        </div>

        <!-- Esqueceu senha -->
        <label class="label">
          <a href="#" id="forgotPasswordLink" class="label-text-alt link link-hover">Esqueceu a senha?</a>
        </label>

        <!-- Botão de login -->
        <div class="form-control mt-4">
          <button class="btn btn-primary w-full" id="logar" type="submit">Entrar</button>
        </div>
      </form>
    </div>
  </div>
  <div class="card w-full max-w-md shadow-2xl bg-base-100 hidden transition-all duration-300 ease-in-out"
    id="confirmPasswordForm">
    <div class="card-body">
      <!-- Formulário de Recuperação de Senha -->
      <h2 class="text-2xl font-bold text-primary text-center">Recuperar Senha</h2>
      <h5 class="text-1x1 text-gray-400 text-center">Informe seu usuário para receber instruções de
        recuperação.</h5>
      <!-- Formulário -->
      <form action="javascript:checkEmail()" class="mt-6">
        <!-- Usuário -->
        <div class="form-control">
          <label class="label">
            <span class="label-text">Usuário</span>
          </label>
          <label class="input input-bordered flex items-center gap-2">
            <i class="fas fa-user text-gray-500"></i>
            <input type="text" id="resetUsuario" placeholder="Digite seu usuário" class="grow" required />
          </label>
        </div>
        <!-- Botões -->
        <div class="form-control mt-6 flex flex-row gap-2">
          <button class="btn btn-outline flex-1" onclick="voltarLogin()" type="button">Voltar</button>
          <button class="btn btn-primary flex-1" id="confirmarEmail" type="submit">Recuperar Senha</button>
        </div>
      </form>

    </div>
  </div>
  <div class="card w-full max-w-md shadow-2xl bg-base-100 hidden transition-all duration-300 ease-in-out"
    id="resetPasswordForm">
    <div class="card-body">
      <!-- Formulário de Recuperação de Senha -->
      <h2 class="text-2xl font-bold text-primary text-center">Recuperar Senha</h2>
      <h5 class="text-1x1 text-gray-400 text-center">Informe seu usuário para receber instruções de
        recuperação.</h5>
      <!-- Formulário -->
      <form action="javascript:resetPassword()" class="mt-6">
        <div class="form-control">
          <label class="label">
            <span class="label-text">E-mail</span>
          </label>
          <label class="input input-bordered flex items-center gap-2">
            <i class="fas fa-mail text-gray-500"></i>
            <input type="text" id="emailUsuario" placeholder="Digite seu usuário" class="grow" readonly />
          </label>
        </div>
        <!-- Botões -->
        <div class="form-control mt-6 flex flex-row gap-2">
          <button class="btn btn-outline flex-1" onclick="voltarLogin()" type="button">Voltar</button>
          <button class="btn btn-primary flex-1" id="resetarSenha" type="submit">Confirmar Email</button>
        </div>
      </form>

    </div>
  </div>

  <!-- Toast Notification -->
  <div class="fixed bottom-4 right-4 z-50" id="liveToast"></div>
</body>

</html>
