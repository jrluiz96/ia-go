<!DOCTYPE html>
<html lang="pt-br" data-theme="dim">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IA-GO</title>
    <link rel="icon" href="/img/logo/Icon.svg" type="image/x-icon">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.7.2/dist/full.min.css" rel="stylesheet" type="text/css" />

    <script src="/js/jquery.js?v=4"></script>
    <!-- Ícones (Font Awesome) -->
    <link rel="stylesheet" href="/fonts/font-awesome/7.1.0/css/all.min.css">

    <script src="/js/request.js?v=4"></script>
    <script src="/js/glob.js?v=4"></script>
</head>

<body class="min-h-screen flex items-center justify-center bg-base-200">
    <div class="card w-full max-w-md shadow-2xl bg-base-100 transition-all duration-300 ease-in-out">
        <div class="card-body">
            <img src="/img/logo/IA-GO-dark.svg" alt="Logo IA-GO" class="w-100 h-100 mb-4" />
            <h2 class="text-2xl font-bold text-primary text-center">Página não encontrada.</h2>
            <h5 class="text-1x1 text-gray-400 text-center">Nada encontrado por aqui, tente novamente.</h5>
            <a href="/login.html" id="linkLogin" class="text-center label-text-alt link link-hover">Voltar para o Login</a>
        </div>
    </div>
    <!-- Toast Notification -->
    <div class="fixed bottom-4 right-4 z-50">
        <div id="liveToast" class="hidden max-w-sm w-full bg-white border border-gray-300 rounded-lg shadow-lg">
            <div class="flex items-center justify-between px-4 py-2 border-b border-gray-200">
                <div class="flex items-center gap-2">
                    <div id="avisoColor" class="w-3 h-3 rounded-full"></div>
                    <strong class="text-gray-800 text-sm"></strong>
                </div>
                <button type="button" class="text-gray-500 hover:text-gray-700"
                    onclick="document.getElementById('liveToast').classList.add('hidden')">
                    &times;
                </button>
            </div>
            <div class="px-4 py-3 text-gray-700 text-sm toast-body"></div>
        </div>
    </div>
    <script>
        const host = window.location.host; 
        document.getElementById('linkLogin').href = `http://${host}/login.html`;
    </script>
</body>

</html>
