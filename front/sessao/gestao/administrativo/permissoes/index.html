<div class="container mx-auto p-4 space-y-6">
    <!-- Header -->
    <div class="flex justify-between items-center">
        <div>
            <h1 class="text-3xl font-bold text-base-content">Gerenciamento de Permissões e Telas</h1>
            <p class="text-base-content/70 mt-1">Gerencie permissões do sistema e suas telas associadas</p>
        </div>
    </div>

    <!-- Tabs -->
    <div class="tabs tabs-boxed bg-base-300">
        <a id="tab-permissoes" class="tab tab-active" onclick="switchTab('permissoes')">
            <i class="fas fa-user-shield mr-2"></i>
            Permissões
        </a>
        <a id="tab-telas" class="tab" onclick="switchTab('telas')">
            <i class="fas fa-desktop mr-2"></i>
            Telas
        </a>
    </div>

    <!-- Aba Permissões -->
    <div id="aba-permissoes" class="space-y-4">
        <!-- Filtros Permissões -->
        <div class="card bg-base-100 shadow-sm">
            <div class="card-body p-4">
                <form id="filtros-permissoes" class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                    <!-- Busca -->
                    <div class="form-control">
                        <label class="label">
                            <span class="label-text">Buscar</span>
                        </label>
                        <input type="text" id="filtro-permissoes-busca" name="q" class="input input-bordered"
                            placeholder="Nome da permissão...">
                    </div>

                    <!-- Status -->
                    <div class="form-control">
                        <label class="label">
                            <span class="label-text">Status</span>
                        </label>
                        <select id="filtro-permissoes-status" name="status" class="select select-bordered">
                            <option value="ativo" selected>Ativo</option>
                            <option value="deletado">Deletado</option>
                            <option value="todos">Todos</option>
                        </select>
                    </div>

                    <!-- Botões -->
                    <div class="form-control">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-search mr-2"></i>
                            Filtrar
                        </button>
                    </div>

                    <div class="form-control">
                        <button type="button" id="btn-nova-permissao" class="btn btn-success">
                            <i class="fas fa-plus mr-2"></i>
                            Nova Permissão
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Tabela Permissões -->
        <div class="card bg-base-100 shadow-sm">
            <div class="card-body p-0">
                <!-- Loading -->
                <div id="permissoes-loading" class="hidden p-8">
                    <progress class="progress progress-primary w-full"></progress>
                    <p class="text-center mt-2">Carregando permissões...</p>
                </div>

                <!-- Tabela -->
                <div id="permissoes-data-container">
                    <table class="table table-zebra">
                        <thead>
                            <tr>
                                <th class="cursor-pointer" data-sort="nome">
                                    Nome
                                    <i class="fas fa-sort ml-1"></i>
                                </th>
                                <th class="cursor-pointer" data-sort="created_at">
                                    Criado em
                                    <i class="fas fa-sort ml-1"></i>
                                </th>
                                <th class="cursor-pointer" data-sort="updated_at">
                                    Atualizado em
                                    <i class="fas fa-sort ml-1"></i>
                                </th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="permissoes-tbody">
                            <!-- Dados serão inseridos aqui -->
                        </tbody>
                    </table>
                </div>

                <!-- Paginação -->
                <div id="permissoes-pagination-container" class="p-4 border-t">
                    <!-- Paginação será inserida aqui -->
                </div>
            </div>
        </div>
    </div>

    <!-- Aba Telas -->
    <div id="aba-telas" class="space-y-4 hidden">
        <!-- Filtros Telas -->
        <div class="card bg-base-100 shadow-sm">
            <div class="card-body p-4">
                <form id="filtros-telas" class="grid grid-cols-1 md:grid-cols-5 gap-4 items-end">
                    <!-- Busca -->
                    <div class="form-control">
                        <label class="label">
                            <span class="label-text">Buscar</span>
                        </label>
                        <input type="text" id="filtro-telas-busca" name="q" class="input input-bordered"
                            placeholder="Nome ou URL...">
                    </div>

                    <!-- Canal -->
                    <div class="form-control">
                        <label class="label">
                            <span class="label-text">Canal</span>
                        </label>
                        <select id="filtro-telas-canal" name="canal_id" class="select select-bordered">
                            <option value="">Todos os canais</option>
                            <!-- Options serão carregadas dinamicamente -->
                        </select>
                    </div>

                    <!-- Status -->
                    <div class="form-control">
                        <label class="label">
                            <span class="label-text">Status</span>
                        </label>
                        <select id="filtro-telas-status" name="status" class="select select-bordered">
                            <option value="ativo" selected>Ativo</option>
                            <option value="deletado">Deletado</option>
                            <option value="todos">Todos</option>
                        </select>
                    </div>

                    <!-- Botões -->
                    <div class="form-control">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-search mr-2"></i>
                            Filtrar
                        </button>
                    </div>

                    <div class="form-control">
                        <button type="button" id="btn-nova-tela" class="btn btn-success">
                            <i class="fas fa-plus mr-2"></i>
                            Nova Tela
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Tabela Telas -->
        <div class="card bg-base-100 shadow-sm">
            <div class="card-body p-0">
                <!-- Loading -->
                <div id="telas-loading" class="hidden p-8">
                    <progress class="progress progress-primary w-full"></progress>
                    <p class="text-center mt-2">Carregando telas...</p>
                </div>

                <!-- Tabela -->
                <div id="telas-data-container">
                    <table class="table table-zebra">
                        <thead>
                            <tr>
                                <th class="cursor-pointer" data-sort="nome">
                                    Nome
                                    <i class="fas fa-sort ml-1"></i>
                                </th>
                                <th class="cursor-pointer" data-sort="url">
                                    URL
                                    <i class="fas fa-sort ml-1"></i>
                                </th>
                                <th>Ícone</th>
                                <th class="cursor-pointer" data-sort="peso">
                                    Peso
                                    <i class="fas fa-sort ml-1"></i>
                                </th>
                                <th>Canais</th>
                                <th class="cursor-pointer" data-sort="created_at">
                                    Criado em
                                    <i class="fas fa-sort ml-1"></i>
                                </th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="telas-tbody">
                            <!-- Dados serão inseridos aqui -->
                        </tbody>
                    </table>
                </div>

                <!-- Paginação -->
                <div id="telas-pagination-container" class="p-4 border-t">
                    <!-- Paginação será inserida aqui -->
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Containers -->
    <div id="permissao-modal-container"></div>
    <div id="tela-modal-container"></div>
    <div id="vinculos-modal-container"></div>
</div>

<script src="/sessao/gestao/administrativo/permissoes/js.js?v=4"></script>
