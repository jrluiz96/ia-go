<div class="space-y-6 container-fluid">
    <!-- Cabeçalho -->
    <div class="flex justify-between items-center">
        <div class="text-left">
            <h1 class="text-2xl font-bold">Relatório Webbot</h1>
            <p class="text-sm">Histórico analítico de atendimentos webbot</p>
        </div>
    </div>

    <!-- Filtros -->
    <div class="card bg-base-100 shadow-md">
        <div class="card-body">
            <h2 class="card-title mb-2">Filtros</h2>

            <!-- Filtros Básicos -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div>
                    <label for="wb_empresa_select" class="label">
                        <span class="label-text">Empresa</span>
                    </label>
                    <select id="wb_empresa_select" class="select select-bordered w-full">
                        <option value="">Todas as empresas</option>
                    </select>
                </div>
                <div>
                    <label for="wb_data_inicio" class="label">
                        <span class="label-text">Data Início</span>
                    </label>
                    <input type="date" id="wb_data_inicio" class="input input-bordered w-full" />
                </div>
                <div>
                    <label for="wb_data_fim" class="label">
                        <span class="label-text">Data Fim</span>
                    </label>
                    <input type="date" id="wb_data_fim" class="input input-bordered w-full" />
                </div>
                <div></div>
            </div>

            <!-- Filtros Avançados (collapse) -->
            <div class="mt-4">
                <div class="collapse collapse-arrow bg-base-200 rounded-lg overflow-visible">
                    <input type="checkbox" id="collapse_filtros_avancados_wb" />
                    <div class="collapse-title font-medium flex items-center gap-2">
                        <i class="fas fa-sliders-h"></i>
                        Filtros Avançados
                    </div>
                    <div class="collapse-content overflow-visible">
                        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 pt-2">
                            <div>
                                <label class="label"><span class="label-text">Broker</span></label>
                                <select id="wb_broker_select" class="select select-bordered select-sm w-full">
                                    <option value="">Todos os brokers</option>
                                </select>
                            </div>
                            <div>
                                <label class="label"><span class="label-text">Operador</span></label>
                                <select id="wb_operador_select" class="select select-bordered select-sm w-full">
                                    <option value="">Todos os operadores</option>
                                </select>
                            </div>
                            <div>
                                <label class="label"><span class="label-text">Fila</span></label>
                                <select id="wb_fila_select" class="select select-bordered select-sm w-full">
                                    <option value="">Todas as filas</option>
                                </select>
                            </div>
                            <div>
                                <label class="label"><span class="label-text">Status</span></label>
                                <select id="wb_status_select" class="select select-bordered select-sm w-full">
                                    <option value="">Todos os status</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Botões de Ação -->
            <div class="flex justify-end gap-4 mt-4">
                <button id="wb_btn_limpar" class="btn btn-outline btn-ghost">
                    <i class="fas fa-eraser mr-2"></i>
                    Limpar
                </button>
                <button id="wb_btn_filtrar" class="btn btn-primary">
                    <i class="fas fa-search mr-2"></i>
                    Buscar
                </button>
            </div>
        </div>
    </div>

    <!-- Cards de métricas -->
    <div class="grid grid-cols-2 md:grid-cols-5 gap-3" id="wb_cards_metricas" style="display:none;">
        <div class="stat bg-base-100 rounded-lg shadow-sm p-3">
            <div class="stat-title text-xs">Total</div>
            <div class="stat-value text-lg text-primary" id="wb_metric_total">0</div>
        </div>
        <div class="stat bg-base-100 rounded-lg shadow-sm p-3">
            <div class="stat-title text-xs">Finalizados</div>
            <div class="stat-value text-lg text-success" id="wb_metric_finalizados">0</div>
        </div>
        <div class="stat bg-base-100 rounded-lg shadow-sm p-3">
            <div class="stat-title text-xs">Abandono/Sessão expirada (24h)</div>
            <div class="stat-value text-lg text-warning" id="wb_metric_abandono_expirado">0</div>
        </div>
        <div class="stat bg-base-100 rounded-lg shadow-sm p-3">
            <div class="stat-title text-xs">TT Médio</div>
            <div class="stat-value text-lg" id="wb_metric_tt_medio">-</div>
        </div>
    </div>

    <!-- Tabela -->
    <div class="card bg-base-100 shadow-md">
        <div class="card-body p-4">
            <div class="flex justify-end mb-2 gap-2">
                <button id="wb_btn_exportar_xlsx" class="btn btn-success btn-sm" disabled>
                    <i class="fas fa-file-excel mr-2"></i>Exportar XLSX
                </button>
            </div>
            <div id="wb_container_tabela" class="overflow-x-auto">
                <div class="text-center py-12 opacity-60">
                    <i class="fas fa-comments text-6xl mb-4"></i>
                    <p class="text-lg">Aplique os filtros e clique em "Buscar" para carregar os dados</p>
                </div>
            </div>
            <div id="wb_container_paginacao" class="mt-3"></div>
        </div>
    </div>
</div>

<!-- Modal: Ver Conversa -->
<dialog id="wb_modal_conversa" class="modal">
    <div class="modal-box max-w-2xl flex flex-col" style="height:90vh;">
        <form method="dialog">
            <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button>
        </form>

        <h3 class="font-bold text-lg mb-3">
            <i class="fas fa-comments mr-2"></i>Conversa
        </h3>

        <!-- Info rápida do atendimento -->
        <div class="bg-base-200 rounded-lg p-3 mb-3 text-sm grid grid-cols-2 gap-2" id="wb_modal_info">
            <div><span class="opacity-60">Número:</span> <span id="wb_modal_numero">-</span></div>
            <div><span class="opacity-60">Operador:</span> <span id="wb_modal_operador">-</span></div>
            <div><span class="opacity-60">Início:</span> <span id="wb_modal_inicio">-</span></div>
            <div><span class="opacity-60">Status:</span> <span id="wb_modal_status">-</span></div>
        </div>

        <!-- Botão download -->
        <div class="flex gap-2 mb-3">
            <button id="wb_btn_download_txt" class="btn btn-sm btn-outline" disabled>
                <i class="fas fa-file-alt mr-1"></i>Download TXT
            </button>
            <button id="wb_btn_download_html" class="btn btn-sm btn-outline" disabled>
                <i class="fas fa-file-code mr-1"></i>Download HTML
            </button>
            <button id="wb_btn_download_pdf" class="btn btn-sm btn-outline" disabled>
                <i class="fas fa-file-pdf mr-1"></i>Download PDF
            </button>
        </div>

        <!-- Mensagens (scroll) -->
        <div id="wb_modal_mensagens" class="flex-1 overflow-y-auto bg-base-200 rounded-lg p-3 space-y-2 min-h-0">
            <div class="text-center opacity-40 py-8">
                <span class="loading loading-spinner loading-md"></span>
                <p class="mt-2">Carregando...</p>
            </div>
        </div>

        <div class="modal-action mt-3">
            <form method="dialog"><button class="btn btn-sm">Fechar</button></form>
        </div>
    </div>
    <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js?v=4"></script>
<script src="/sessao/relatorios/whatsapp/js.js?v=4"></script>
