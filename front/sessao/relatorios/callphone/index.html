
<div class="space-y-6 container-fluid">
    <!-- Cabeçalho -->
    <div class="flex justify-between items-center">
        <div class="text-left">
            <h1 class="text-2xl font-bold">Relatórios Callphone</h1>
            <p class="text-sm">Análise e métricas de atendimento</p>
        </div>
    </div>

    <!-- Filtros -->
    <div class="card bg-base-100 shadow-md">
        <div class="card-body">
            <h2 class="card-title mb-2">Filtros</h2>
            
            <!-- Filtros Básicos -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div>
                    <label for="data_inicio" class="label">
                        <span class="label-text">Data/Hora Início</span>
                    </label>
                    <input 
                        type="datetime-local" 
                        id="data_inicio" 
                        class="input input-bordered w-full"
                    />
                </div>
                <div>
                    <label for="data_fim" class="label">
                        <span class="label-text">Data/Hora Fim</span>
                    </label>
                    <input 
                        type="datetime-local" 
                        id="data_fim" 
                        class="input input-bordered w-full"
                    />
                </div>
                <div>
                    <label for="empresa" class="label">
                        <span class="label-text">Empresa</span>
                    </label>
                    <select 
                        id="empresa" 
                        class="select select-bordered w-full"
                    >
                        <option value="">Todas as empresas</option>
                    </select>
                </div>
                <div>
                    <label for="tipo_relatorio" class="label">
                        <span class="label-text">Tipo do Relatório</span>
                    </label>
                    <select 
                        id="tipo_relatorio" 
                        class="select select-bordered w-full"
                        required
                    >
                        <option value="" selected>Selecione o relatório</option>
                        <option value="geral">Geral</option>
                        <option value="analitico" disabled>Analítico</option>
                        <option value="discador" disabled>Discador</option>
                        <option value="receptivo" disabled>Receptivo</option>
                        <option value="operadores" disabled>Operadores</option>
                    </select>
                </div>
            </div>

            <!-- Filtros Avançados (collapse - só para relatório geral) -->
            <div id="filtros_avancados_container" class="hidden mt-4">
                <div class="collapse collapse-arrow bg-base-200 rounded-lg overflow-visible">
                    <input type="checkbox" id="collapse_filtros_avancados" />
                    <div class="collapse-title font-medium flex items-center gap-2">
                        <i class="fas fa-sliders-h"></i>
                        Filtros Avançados
                    </div>
                    <div class="collapse-content overflow-visible">
                        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 pt-2">
                            <div>
                                <label class="label"><span class="label-text">Protocolo Interno</span></label>
                                <input type="text" id="protocolo_interno" class="input input-bordered input-sm w-full" placeholder="Protocolo interno" />
                            </div>
                            <div>
                                <label class="label"><span class="label-text">Operador</span></label>
                                <select id="filtro_operador" class="select select-bordered select-sm w-full">
                                    <option value="">Todos</option>
                                </select>
                            </div>
                            <div>
                                <label class="label"><span class="label-text">Número Cliente</span></label>
                                <input type="text" id="num_cliente" class="input input-bordered input-sm w-full" placeholder="Número do cliente" />
                            </div>
                            <div class="relative">
                                <label class="label"><span class="label-text">Fila</span></label>
                                <div class="dropdown dropdown-end w-full" id="dropdown-filas">
                                    <div tabindex="0" role="button" class="select select-bordered select-sm w-full flex items-center justify-between" id="btn-dropdown-filas">
                                        <span id="filas-selecionadas-text" class="truncate">Selecione uma empresa primeiro</span>
                                        <i class="fas fa-chevron-down text-xs"></i>
                                    </div>
                                    <div tabindex="0" class="dropdown-content bg-base-200 rounded-box shadow-xl min-w-72 max-h-60 overflow-y-auto p-2 mt-1" style="z-index: 9999; position: absolute;">
                                        <div id="filas-lista" class="space-y-1">
                                            <!-- Filas serão carregadas aqui -->
                                        </div>
                                    </div>
                                </div>
                                <input type="hidden" id="filtro_fila" value="">
                            </div>
                            <div>
                                <label class="label"><span class="label-text">Status</span></label>
                                <select id="filtro_status" class="select select-bordered select-sm w-full">
                                    <option value="">Todos</option>
                                    <option value="4">Finalizada</option>
                                    <option value="1">Abandono</option>
                                    <option value="2">Em Andamento</option>
                                    <option value="3">Erro</option>
                                </select>
                            </div>
                            <div>
                                <label class="label"><span class="label-text">Origem Desligamento</span></label>
                                <select id="filtro_origem_desligamento" class="select select-bordered select-sm w-full">
                                    <option value="">Todos</option>
                                    <option value="1">Cliente Desligou</option>
                                    <option value="2">Atendente Desligou</option>
                                </select>
                            </div>
                            <div>
                                <label class="label"><span class="label-text">Tipo Ligação</span></label>
                                <select id="filtro_tipo" class="select select-bordered select-sm w-full">
                                    <option value="">Todos</option>
                                    <option value="2">Receptivo</option>
                                    <option value="1">Ativo</option>
                                </select>
                            </div>
                            <div>
                                <label class="label"><span class="label-text">Iniciou Fila</span></label>
                                <select id="filtro_inicio_fila" class="select select-bordered select-sm w-full">
                                    <option value="">Todos</option>
                                    <option value="2">Iniciou</option>
                                    <option value="1">Não Iniciou</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Botões de Ação -->
            <div class="flex justify-end gap-4 mt-4">
                <button 
                    id="btn_limpar_filtros" 
                    class="btn btn-outline btn-ghost"
                >
                    <i class="fas fa-eraser mr-2"></i>
                    Limpar
                </button>
                <button 
                    id="btn_aplicar_filtros" 
                    class="btn btn-primary"
                >
                    <i class="fas fa-search mr-2"></i>
                    Buscar
                </button>
            </div>
        </div>
    </div>

    <!-- Container do Relatório (só resultado) -->
    <div id="relatorio_content" class="card bg-base-100 shadow-md">
        <div class="card-body">
            <div class="text-center py-12 opacity-60">
                <i class="fas fa-chart-bar text-6xl mb-4"></i>
                <p class="text-lg">Selecione um tipo de relatório e clique em "Buscar"</p>
            </div>
        </div>
    </div>
</div>

<script src="/sessao/relatorios/callphone/js.js?v=4"></script>
