<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Ativos - Callcenter</title>
    <link rel="icon" type="image/svg+xml" href="/img/logo/bashIcon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root{
            --bg: #f6f8fa;
            --card: #ffffff;
            --muted: #6b7280;
            --dark: #0f172a;
            --primary: #0b63a6;
            --accent: #0f8bd6;
            --radius: 10px;
            --gap: 24px;
            --shadow-sm: 0 6px 18px rgba(12, 24, 48, 0.06);
        }

        *{box-sizing: border-box;margin:0;padding:0}
        body{font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; background:var(--bg); color:var(--dark);}

        header{background:transparent;padding:18px 0}
        .nav-container{max-width:1100px;margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between}
        .brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--dark)}
        .brand-logo{width:44px;height:44px;border-radius:8px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
        .brand-text{font-weight:700;font-size:18px}

        nav ul{list-style:none;display:flex;gap:18px;align-items:center}
        nav a{color:var(--dark);text-decoration:none;font-weight:600}
        .btn-login{background:var(--primary);color:#fff;padding:10px 18px;border-radius:8px;text-decoration:none;font-weight:700}
        .btn-login:hover{background:var(--accent)}

        main{max-width:1100px;margin:18px auto;padding:28px 20px}

        .hero{display:grid;grid-template-columns:1fr 420px;gap:32px;align-items:center;margin-top:18px}
        .hero-left{padding:28px 0}
        .kicker{display:inline-block;background:#e6f0fb;color:var(--primary);padding:8px 12px;border-radius:999px;font-weight:700;margin-bottom:16px}
        .headline{font-size:40px;line-height:1.05;margin-bottom:18px;color:var(--dark)}
        .lead{color:var(--muted);font-size:16px;margin-bottom:22px}
        .hero-cta{display:flex;gap:12px;align-items:center}
        .primary-cta{background:var(--primary);color:#fff;padding:12px 20px;border-radius:10px;text-decoration:none;font-weight:700}
        .ghost-cta{background:transparent;border:1px solid #dbeafe;padding:10px 18px;border-radius:10px;color:var(--primary);text-decoration:none;font-weight:700}

        .hero-right{background:var(--card);border-radius:12px;padding:20px;box-shadow:var(--shadow-sm)}
        .stats{display:flex;gap:12px;justify-content:space-between}
        .stat{flex:1;text-align:center;padding:12px;border-radius:8px}
        .stat b{display:block;font-size:20px;color:var(--dark)}
        .stat p{color:var(--muted);font-size:13px}

        .features{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--gap);margin-top:32px}
        .feature{background:var(--card);padding:20px;border-radius:10px;box-shadow:var(--shadow-sm);display:flex;gap:12px;align-items:flex-start}
        .feature-icon{width:56px;height:56px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px}
        .feature h4{margin:0 0 6px 0;font-size:16px}
        .feature p{margin:0;color:var(--muted);font-size:14px}

        .trust{margin-top:28px;color:var(--muted);font-size:14px;text-align:center}

        footer{margin-top:48px;padding:28px 20px;background:transparent;text-align:center;color:var(--muted)}

        @media (max-width:1000px){
            .hero{grid-template-columns:1fr}
            .hero-right{order:-1}
            .features{grid-template-columns:1fr}
            .headline{font-size:32px}
        }

    </style>
</head>
<body>
    <header>
        <div class="nav-container">
            <a class="brand" href="/index.html">
                <div class="brand-logo">IA-GO</div>
            </a>
            <nav>
                <ul>
                    <li><a href="/index.html">Início</a></li>
                    <li><a href="/login.html" class="btn-login">Login</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>

        <div style="margin-top:28px;text-align:center">
            <a href="/login.html" class="primary-cta" style="text-decoration:none">Teste a plataforma</a>
        </div>

    </main>

    <footer>
        <p>&copy; 2026.</p>
    </footer>

</body>
</html>
